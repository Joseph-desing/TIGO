<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Mis Contrataciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>

  <ion-card *ngFor="let c of contrataciones">
    <ion-card-header>
      <ion-card-title>{{ c.plan_nombre }}</ion-card-title>

      <ion-badge [color]="c.estado === 'APROBADO' ? 'success' : 'warning'">
        {{ c.estado }}
      </ion-badge>
    </ion-card-header>

    <ion-card-content>
      <p>Fecha: {{ c.fecha | date:'yyyy-MM-dd' }}</p>

      <ion-button expand="block"
                  color="primary"
                  (click)="abrirChat(c.id)">
        Chat con Asesor
      </ion-button>
    </ion-card-content>
  </ion-card>

  <p *ngIf="!loading && contrataciones.length === 0">
    Aún no tienes contrataciones registradas.
  </p>

</ion-content>
