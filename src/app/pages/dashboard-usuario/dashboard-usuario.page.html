<ion-content class="ion-padding dashboard-usuario">

  <ion-header collapse="condense" class="custom-header">
    <ion-toolbar>
      <ion-title>Panel de Usuario</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="welcome">
    <h1>Hola, usuario Tigo 👋</h1>
    <p>Elige qué deseas hacer</p>
  </div>

  <div class="cards">

    <ion-card button="true" (click)="verCatalogo()">
      <ion-card-header>
        <ion-card-title>Ver catálogo de planes</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        Explora todos los planes disponibles y sus beneficios.
      </ion-card-content>
    </ion-card>

    <ion-card button="true" (click)="verMisContrataciones()">
      <ion-card-header>
        <ion-card-title>Mis contrataciones</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        Revisa el estado de tus contrataciones y accede al chat.
      </ion-card-content>
    </ion-card>

    <ion-card button="true" (click)="verPerfil()">
      <ion-card-header>
        <ion-card-title>Mi perfil</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        Consulta y actualiza tu información personal.
      </ion-card-content>
    </ion-card>

  </div>

  <div class="footer">
    <ion-button fill="clear" (click)="irSplash()">
      Volver al inicio
    </ion-button>
  </div>

</ion-content>
