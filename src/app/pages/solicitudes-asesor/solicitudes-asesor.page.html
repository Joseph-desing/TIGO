<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Solicitudes de Contratación</ion-title>

    <ion-chip slot="start" color="success" class="rol-chip">
      <ion-label>Asesor Comercial</ion-label>
    </ion-chip>
  </ion-toolbar>
</ion-header>

<ion-content class="solicitudes-content">

  <ion-list *ngIf="solicitudes.length; else sinSolicitudes">
    <ion-card class="solicitud-card" *ngFor="let s of solicitudes">
      <ion-card-content>

        <div class="solicitud-header">
          <div>
            <h2>{{ s.cliente }}</h2>
            <p>{{ s.plan }}</p>
            <small>{{ s.fecha }}</small>
          </div>

          <div
            class="estado-badge"
            [ngClass]="{
              'estado-pendiente': s.estado === 'PENDIENTE',
              'estado-aprobado': s.estado === 'APROBADO',
              'estado-rechazado': s.estado === 'RECHAZADO'
            }">
            {{ s.estado }}
          </div>
        </div>

        <div class="solicitud-actions">
          <ion-button
            color="success"
            (click)="aprobarSolicitud(s)"
            [disabled]="s.estado === 'APROBADO'">
            ✓ Aprobar
          </ion-button>

          <ion-button
            color="danger"
            (click)="rechazarSolicitud(s)"
            [disabled]="s.estado === 'RECHAZADO'">
            ✗ Rechazar
          </ion-button>
        </div>

      </ion-card-content>
    </ion-card>
  </ion-list>

  <ng-template #sinSolicitudes>
    <div class="empty-state">
      No hay solicitudes de contratación por el momento.
    </div>
  </ng-template>
</ion-content>

<!-- Footer tabs -->
<ion-footer>
  <ion-toolbar>
    <ion-segment value="solicitudes" class="asesor-tabs">
      <ion-segment-button value="planes" (click)="goToPlanes()">
        <ion-label>Planes</ion-label>
      </ion-segment-button>

      <ion-segment-button value="solicitudes">
        <ion-label>Solicitudes</ion-label>
      </ion-segment-button>

      <ion-segment-button value="chats" (click)="goToChats()">
        <ion-label>Chats</ion-label>
      </ion-segment-button>

      <ion-segment-button value="perfil" (click)="goToPerfil()">
        <ion-label>Perfil</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-footer>
