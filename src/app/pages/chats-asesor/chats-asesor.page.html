<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Conversaciones</ion-title>

    <ion-chip slot="start" color="success" class="rol-chip">
      <ion-label>Asesor Comercial</ion-label>
    </ion-chip>
  </ion-toolbar>
</ion-header>

<ion-content class="chats-content">

  <ion-list *ngIf="conversaciones.length > 0; else noChats">
    <ion-item
      button
      detail="false"
      class="chat-item"
      *ngFor="let c of conversaciones"
      (click)="abrirChat(c)">

      <!-- Avatar redondo con inicial -->
      <div class="avatar-circle" slot="start">
        <span>{{ c.nombre?.[0] || 'U' }}</span>
      </div>

      <ion-label>
        <h2>{{ c.nombre }}</h2>
        <p>{{ c.ultimoMensaje }}</p>
      </ion-label>

      <div class="chat-right">
        <span class="hora" *ngIf="c.hora">{{ c.hora }}</span>
        <span class="dot" *ngIf="c.tieneNoLeidos"></span>
      </div>
    </ion-item>
  </ion-list>

  <ng-template #noChats>
    <div class="empty-state">
      <p>No hay usuarios registrados todavía.</p>
    </div>
  </ng-template>

</ion-content>

<!-- Footer tabs del asesor -->
<ion-footer>
  <ion-toolbar>
    <ion-segment value="chats" class="asesor-tabs">
      <ion-segment-button value="planes" (click)="goToPlanes()">
        <ion-label>Planes</ion-label>
      </ion-segment-button>

      <ion-segment-button value="solicitudes" (click)="goToSolicitudes()">
        <ion-label>Solicitudes</ion-label>
      </ion-segment-button>

      <ion-segment-button value="chats">
        <ion-label>Chats</ion-label>
      </ion-segment-button>

      <ion-segment-button value="perfil" (click)="goToPerfil()">
        <ion-label>Perfil</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-footer>
