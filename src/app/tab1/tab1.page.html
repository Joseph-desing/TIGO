<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Usuario Registrado</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-searchbar placeholder="Buscar planes"></ion-searchbar>

  <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>

  <div *ngIf="!loading">

    <ion-card *ngFor="let plan of planes" class="plan-card">
      <ion-card-header>
        <ion-card-title>{{ plan.nombre }}</ion-card-title>
        <h2 class="precio">\${{ plan.precio }}</h2>
      </ion-card-header>

      <ion-card-content>
        <p>{{ plan.descripcion }}</p>

        <ion-button expand="block"
                    (click)="verDetalle(plan.id)">
          Ver Detalles
        </ion-button>
      </ion-card-content>
    </ion-card>

  </div>

</ion-content>
